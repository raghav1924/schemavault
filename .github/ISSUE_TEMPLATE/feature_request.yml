name: Feature Request
description: Suggest an enhancement or new SQL rule for SchemaVault
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SchemaVault!
  - type: textarea
    id: problem
    attributes:
      label: Is your request related to a Postgres / Supabase schema linter rule?
      description: Explain the migration safety or policy check.
      placeholder: When running migrations that alter column types in PostgreSQL...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed rule or feature
      description: How should SchemaVault detect and report this issue?
    validations:
      required: true

